name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  plugin:
    name: Build Velocity plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test + build shaded jar
        working-directory: plugin
        run: |
          chmod +x gradlew
          ./gradlew test shadowJar --no-daemon --console=plain
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: australis-plugin
          path: plugin/build/libs/*.jar

  paper:
    name: Build Paper plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test + build shaded jar
        working-directory: paper
        run: |
          chmod +x gradlew
          ./gradlew test shadowJar --no-daemon --console=plain
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: australis-paper-plugin
          path: paper/build/libs/*.jar

  limbo:
    name: Build limbo verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test + build shaded jar
        working-directory: limbo
        run: |
          chmod +x gradlew
          ./gradlew test shadowJar --no-daemon --console=plain
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: australis-limbo-plugin
          path: limbo/build/libs/*.jar

  bungee:
    name: Build BungeeCord plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Test + build shaded jar
        working-directory: bungee
        run: |
          chmod +x gradlew
          ./gradlew test shadowJar --no-daemon --console=plain
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: australis-bungee-plugin
          path: bungee/build/libs/*.jar

  edge:
    name: Build edge binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet + test + build
        working-directory: edge
        run: |
          go vet ./...
          go test ./...
          GOOS=linux GOARCH=amd64 go build -o dist/forwarder-amd64 ./cmd/forwarder
          GOOS=linux GOARCH=arm64 go build -o dist/forwarder-arm64 ./cmd/forwarder
          GOOS=linux GOARCH=amd64 go build -o dist/agent-amd64 ./cmd/agent
          GOOS=linux GOARCH=arm64 go build -o dist/agent-arm64 ./cmd/agent
      - name: Upload edge binaries
        uses: actions/upload-artifact@v4
        with:
          name: australis-edge
          path: edge/dist/*

  testkit:
    name: Build load-test harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet + test + build
        working-directory: testkit
        run: |
          go vet ./...
          go test ./...
          GOOS=linux GOARCH=amd64 go build -o dist/floodtest-amd64 ./cmd/floodtest
          GOOS=windows GOARCH=amd64 go build -o dist/floodtest-amd64.exe ./cmd/floodtest
      - name: Upload harness
        uses: actions/upload-artifact@v4
        with:
          name: australis-testkit
          path: testkit/dist/*

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, paper, limbo, bungee, edge, testkit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
