name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  plugin:
    name: Build Velocity plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build shaded jar
        working-directory: plugin
        run: |
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon --console=plain
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: australis-plugin
          path: plugin/build/libs/*.jar

  edge:
    name: Build edge binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet + build
        working-directory: edge
        run: |
          go vet ./...
          GOOS=linux GOARCH=amd64 go build -o dist/forwarder-amd64 ./cmd/forwarder
          GOOS=linux GOARCH=arm64 go build -o dist/forwarder-arm64 ./cmd/forwarder
          GOOS=linux GOARCH=amd64 go build -o dist/agent-amd64 ./cmd/agent
          GOOS=linux GOARCH=arm64 go build -o dist/agent-arm64 ./cmd/agent
      - name: Upload edge binaries
        uses: actions/upload-artifact@v4
        with:
          name: australis-edge
          path: edge/dist/*

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, edge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
